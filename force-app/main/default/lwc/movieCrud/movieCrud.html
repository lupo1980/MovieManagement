<template>
  <lightning-card title="Movies" icon-name="standard:movie">
    <template lwc:if={isListView}>
      <div class="slds-p-horizontal_medium slds-p-top_small">
        <lightning-input
          type="search"
          label="Search movie titles"
          value={searchTerm}
          onchange={handleSearchChange}
        ></lightning-input>
      </div>

      <template lwc:if={errorMessage}>
        <div class="slds-text-color_error slds-p-around_medium" role="alert">
          {errorMessage}
        </div>
      </template>

      <template lwc:if={isLoading}>
        <lightning-spinner
          alternative-text="Loading movies"
        ></lightning-spinner>
      </template>

      <template lwc:if={hasMovies}>
        <lightning-datatable
          column-widths-mode="auto"
          key-field="Id"
          data={movies}
          columns={columns}
          hide-checkbox-column
          onrowaction={handleRowAction}
        ></lightning-datatable>
      </template>

      <template lwc:if={showEmptyState}>
        <p class="slds-p-around_medium slds-text-color_weak">
          No movies found.
        </p>
      </template>

      <template lwc:if={hasNextPage}>
        <div class="slds-align_absolute-center slds-p-around_medium">
          <lightning-button
            label="Load more"
            onclick={handleLoadMore}
            disabled={isLoading}
          ></lightning-button>
        </div>
      </template>

      <div slot="actions">
        <lightning-button
          label="New movie"
          variant="brand"
          onclick={handleNew}
        ></lightning-button>
      </div>
    </template>

    <template lwc:if={isCreateOrEdit}>
      <div class="slds-p-around_medium">
        <h2 class="slds-text-heading_medium slds-m-bottom_medium">
          {formTitle}
        </h2>
        <template lwc:if={errorMessage}>
          <div class="slds-text-color_error slds-m-bottom_small" role="alert">
            {errorMessage}
          </div>
        </template>
        <lightning-record-edit-form
          object-api-name={movieObjectApiName}
          record-id={selectedMovieId}
          onsubmit={handleFormSubmit}
          onsuccess={handleSaveSuccess}
          onerror={handleFormError}
        >
          <lightning-messages></lightning-messages>
          <lightning-input-field
            field-name={nameField}
            required
          ></lightning-input-field>
          <lightning-input-field
            field-name={genreField}
            required
          ></lightning-input-field>
          <lightning-input-field
            field-name={imdbRatingField}
            required
          ></lightning-input-field>

          <template lwc:if={isEditMode}>
            <lightning-file-upload
              label="Attach Image"
              name="fileUploader"
              accept={acceptedFormats}
              record-id={selectedMovieId}
              onuploadfinished={handleUploadFinished}
              multiple
            >
            </lightning-file-upload>
          </template>

          <div class="slds-m-top_medium">
            <lightning-button
              type="submit"
              label="Save"
              variant="brand"
            ></lightning-button>
            <lightning-button
              class="slds-m-left_small"
              label="Cancel"
              onclick={handleBackToList}
            ></lightning-button>
          </div>
        </lightning-record-edit-form>

        <template if:true={files}>
          <lightning-layout
            multiple-rows
            horizontal-align="spread"
            class="slds-m-top_medium"
          >
            <div class="slds-text-heading_small">Attached Images</div>
            <template for:each={files} for:item="file">
              <lightning-layout-item key={file.Id} class="slds-m-top_small">
                <template if:true={file.UrlThumbnail}>
                  <img
                    src={file.UrlThumbnail}
                    alt={file.Title}
                    class="slds-m-top_small"
                  />
                </template>
                <div>{file.Title}</div>
              </lightning-layout-item>
            </template>
          </lightning-layout>
        </template>

        <template if:true={reviews}>
          <template for:each={reviews} for:item="review">
            <div key={review.Id} class="slds-m-top_small">
              <div>{review.Name}</div>
              <div>{review.Review_Text__c}</div>
              <div>{review.Score__c}</div>
              <div>{review.Status__c}</div>
              <div>{review.Nickname__c}</div>
            </div>
          </template>
        </template>
      </div>
    </template>

    <template lwc:if={isViewMode}>
      <div class="slds-p-around_medium">
        <lightning-record-view-form
          object-api-name={movieObjectApiName}
          record-id={selectedMovieId}
        >
          <lightning-output-field
            field-name={nameField}
          ></lightning-output-field>
          <lightning-output-field
            field-name={genreField}
          ></lightning-output-field>
          <lightning-output-field
            field-name={imdbRatingField}
          ></lightning-output-field>
        </lightning-record-view-form>
        <div class="slds-m-top_medium">
          <lightning-button
            label="Edit"
            variant="brand"
            onclick={handleEditSelected}
          ></lightning-button>
          <lightning-button
            class="slds-m-left_small"
            label="Delete"
            variant="destructive"
            onclick={handleDeleteSelected}
          ></lightning-button>
          <lightning-button
            class="slds-m-left_small"
            label="Back to movies"
            onclick={handleBackToList}
          ></lightning-button>
        </div>
      </div>
    </template>
  </lightning-card>
</template>
