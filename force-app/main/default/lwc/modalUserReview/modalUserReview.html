<template>
  <template lwc:if={error}>
    <div class="slds-alert slds-alert_error" role="alert">
      <p>{error}</p>
    </div>
  </template>

  <lightning-modal-header label={movieName}></lightning-modal-header>
  <lightning-modal-body>
    <lightning-input
      label="Nickname (User)"
      value={nickname}
      readonly
    ></lightning-input>

    <lightning-textarea
      label={myLabel.movieReviewInstruction}
      value={reviewText}
      onchange={handleChangeReviewText}
    ></lightning-textarea>

    <lightning-slider
      label="Score"
      value={score}
      min="0"
      max="5"
      step="1"
      onchange={handleChangeScore}
    ></lightning-slider>

    <div class="slds-m-top_small">
      <p>Selected Score: {score}</p>
    </div>

    <lightning-button
      class="slds-m-bottom_small"
      label="Submit Review"
      variant="brand"
      onclick={handleSubmitReview}
    ></lightning-button>
  </lightning-modal-body>
</template>
